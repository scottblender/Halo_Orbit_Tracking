name: Scientific checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/check_notebooks.py
        env:
          HALO_GATEWAY_PERIODS: '2'
      - name: Archive executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-gateway-tracking-notebook
          path: notebooks/*.ipynb
          if-no-files-found: error
          retention-days: 14
