name: Station-keeping scientific checks
on: [push, pull_request]
jobs:
  stationkeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Scientific regression tests
        run: >-
          python -m pytest -q tests/test_stationkeeping.py tests/test_lso_stationkeeping.py
          tests/test_reference_correction.py tests/test_stability.py
          tests/test_scientific_models.py
      - name: Execute both station-keeping notebooks
        run: python scripts/check_notebooks.py --in-process
      - name: Validate executed notebooks and saved results
        run: python scripts/validate_stationkeeping_results.py
      - name: Archive executed notebooks and numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationkeeping-executed-notebooks-and-results
          path: |
            notebooks/01_stationkeeping_identification.ipynb
            notebooks/02_stm_greybox_stationkeeping.ipynb
            artifacts/stationkeeping/
          if-no-files-found: error
          retention-days: 30

