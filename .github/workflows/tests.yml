name: Scientific checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/check_notebooks.py
        env:
          HALO_GATEWAY_PERIODS: '2'
      - name: Archive executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-gateway-tracking-notebook
          path: notebooks/*.ipynb
          if-no-files-found: error
          retention-days: 14
      - name: Commit notebook execution outputs to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Save executed notebook outputs [skip ci]"
            git push origin HEAD:main
          fi
