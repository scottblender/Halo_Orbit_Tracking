name: Scientific checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Validate both research notebooks without overwriting saved visualizations
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for path in sorted(Path("notebooks").glob("*.ipynb")):
              nbformat.validate(nbformat.read(path, as_version=4))
              print("Validated notebook structure:", path)
          PY
      - name: Archive original notebook outputs for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-notebooks-preserved
          path: notebooks/*.ipynb
          if-no-files-found: error
          retention-days: 14
