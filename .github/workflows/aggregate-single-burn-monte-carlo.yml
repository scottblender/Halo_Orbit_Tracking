name: Aggregate completed single-burn trials
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/aggregate-single-burn-monte-carlo.yml

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: src
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  aggregate:
    if: github.head_ref == 'bench/single-burn-monte-carlo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy matplotlib
      - uses: actions/download-artifact@v4
        with:
          pattern: single-burn-trial-*
          merge-multiple: true
          path: benchmark-trials
          github-token: ${{ github.token }}
          run-id: 45108736417
      - run: python scripts/run_single_burn_monte_carlo.py --aggregate benchmark-trials
      - uses: actions/upload-artifact@v4
        with:
          name: single-burn-monte-carlo-results
          path: benchmark-results/
          if-no-files-found: error
