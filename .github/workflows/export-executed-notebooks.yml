name: Export verified executed notebooks once
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-executed-notebooks.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.event.head_commit.message == 'Refine LSO notebook writing and export verified execution'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Execute and validate the revised notebooks
        run: |
          python scripts/build_stationkeeping_notebooks.py
          python scripts/check_notebooks.py --in-process
          python scripts/validate_stationkeeping_results.py
      - name: Export notebook bytes for the authorized GitHub update
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ['01_stationkeeping_identification.ipynb','02_stm_greybox_stationkeeping.ipynb']:
              payload=json.dumps(json.loads((Path('notebooks')/name).read_text()),ensure_ascii=True,separators=(',',':'))
              count=(len(payload)+5999)//6000
              print('NB_BEGIN|'+name+'|'+str(len(payload))+'|'+str(count)+'|'+hashlib.sha256(payload.encode()).hexdigest(),flush=True)
              for index,start in enumerate(range(0,len(payload),6000)):
                  print('NB_CHUNK|'+name+'|'+str(index)+'|'+payload[start:start+6000],flush=True)
              print('NB_END|'+name,flush=True)
          PY
