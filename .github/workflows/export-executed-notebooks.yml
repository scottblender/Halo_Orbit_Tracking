name: Export verified executed notebooks once
on:
  push:
    branches: [main]
    paths: [.github/workflows/export-executed-notebooks.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.event.head_commit.message == 'Refine LSO notebook writing and export verified execution'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Execute and validate the revised notebooks
        run: |
          python scripts/build_stationkeeping_notebooks.py
          python scripts/check_notebooks.py --in-process
          python scripts/validate_stationkeeping_results.py
      - name: Commit verified notebook outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/01_stationkeeping_identification.ipynb notebooks/02_stm_greybox_stationkeeping.ipynb
          if git diff --cached --quiet; then
            echo "The verified notebooks are already current."
          else
            git commit -m "Save verified LSO notebook outputs"
            git push origin HEAD:main
          fi
