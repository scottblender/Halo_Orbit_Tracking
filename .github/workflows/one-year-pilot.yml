name: Halo delta-v prediction experiment
on:
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,neural-narx]"
      - run: python scripts/check_notebooks.py --one notebooks/01_narx_results.ipynb
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
      - run: git diff --exit-code -- notebooks/00_gateway_tracking_comparison.ipynb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: halo-delta-v-prediction
          path: |
            artifacts/delta_v_prediction/
            notebooks/01_narx_results.ipynb
