name: One-year station-keeping pilot and plotted notebooks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'notebooks/**'
      - 'src/halo_tracking/year_study.py'
      - 'src/halo_tracking/gateway_reference_periodic.py'
      - 'scripts/run_one_year_study.py'
      - '.github/workflows/one-year-pilot.yml'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical and learning dependencies
        run: python -m pip install -e '.[dev]'
      - name: Generate real matched 365-day trajectories
        run: |
          python scripts/run_one_year_study.py \
            --days 365 \
            --arcs 1 \
            --training-arcs 20 \
            --measurement-cadence-s 86400 \
            --decisions-per-period 4 \
            --output results/one_year
      - name: Execute cleaned notebooks and embed annual plots
        env:
          HALO_YEAR_REUSE: '1'
          HALO_YEAR_ARCS: '1'
          HALO_YEAR_CADENCE_S: '86400'
          HALO_YEAR_DECISIONS: '4'
        run: python scripts/check_notebooks.py --in-process
      - name: Commit executed notebook plots to pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/00_gateway_tracking_comparison.ipynb notebooks/01_narx_results.ipynb
          if ! git diff --cached --quiet; then
            git commit -m "Embed 365-day simulation plots in notebooks [skip ci]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Archive annual trajectories and plotted notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-year-stationkeeping-pilot
          path: |
            results/one_year/
            notebooks/00_gateway_tracking_comparison.ipynb
            notebooks/01_narx_results.ipynb
          if-no-files-found: warn
