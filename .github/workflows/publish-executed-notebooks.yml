name: Publish executed notebooks once
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-executed-notebooks.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish verified executed notebooks (one-time)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify authorized source revision
        env:
          EXPECTED_PARENT: 3b602d9fa3d9932ca0e0897ffda78d757da1cb25
        run: test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install nbformat
      - uses: actions/download-artifact@v4
        with:
          name: stationkeeping-executed-notebooks-and-results
          run-id: '44930529714'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/executed-notebooks
      - name: Validate source and saved outputs, then copy both notebooks
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/executed-notebooks
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          import nbformat
          names = ['01_stationkeeping_identification.ipynb', '02_stm_greybox_stationkeeping.ipynb']
          for name in names:
              source = Path(os.environ['ARTIFACT_ROOT'])/'notebooks'/name
              target = Path('notebooks')/name
              executed = nbformat.read(source, as_version=4)
              current = nbformat.read(target, as_version=4)
              nbformat.validate(executed)
              assert [(c.cell_type,c.source) for c in executed.cells] == [(c.cell_type,c.source) for c in current.cells], name+' source mismatch'
              code = [c for c in executed.cells if c.cell_type == 'code']
              assert all(c.execution_count is not None for c in code), name+' has unexecuted cells'
              assert not any(o.output_type == 'error' for c in code for o in c.outputs), name+' has an error'
              figures = sum('image/png' in o.get('data',{}) for c in code for o in c.outputs)
              assert figures >= 5, name+' is missing figures'
              print(name, len(code), 'executed code cells;', figures, 'saved figures')
          for name in names:
              shutil.copyfile(Path(os.environ['ARTIFACT_ROOT'])/'notebooks'/name, Path('notebooks')/name)
          PY
      - name: Commit only the two executed notebooks to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- notebooks/01_stationkeeping_identification.ipynb notebooks/02_stm_greybox_stationkeeping.ipynb
          if ! git diff --cached --quiet; then
            git commit -m 'Save both executed station-keeping notebooks with outputs'
            git push origin HEAD:main
          fi
