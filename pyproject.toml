[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "halo-tracking"
version = "0.1.0"
description = "Notebook study of lunar-surface optical tracking of an Earth-Moon L2 spacecraft"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "jupyterlab>=4", "ipykernel>=6"]
[project.optional-dependencies]
polynomial-narx = ["scikit-learn>=1.3", "joblib>=1.3", "nbformat>=5.9"]
dev = ["pytest>=7", "nbformat>=5.9", "nbclient>=0.9", "scikit-learn>=1.3"]
neural-narx = ["torch>=2.2", "narxpy==0.1.0", "scikit-learn>=1.3", "joblib>=1.3"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
